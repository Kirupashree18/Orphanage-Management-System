<div class="orphan-container">
  <h2>Update Orphan Details</h2>
  <img src="vieworphan.jpg" alt="Background Image" class="bg-image">
 
  <div *ngIf="loading" class="loading">Loading...</div>


  <div class="form-group">
    <label for="orphanId">Orphan ID:</label>
    <input 
      type="text" 
      id="orphanId" 
      #orphanIdInput 
      placeholder="Enter Orphan ID" 
      required>
    <button (click)="fetchOrphanDetails(orphanIdInput.value)" [disabled]="loading">Get Orphan Details</button>
    <button class="back" > <a href="/admin-dashboard">Back</a></button>
  </div>


  <div *ngIf="orphan" class="update-orphan-form">
    <h3>Edit Orphan Details</h3>
    <div class="form-group">
      <label for="name">Name:</label>
      <input 
        type="text" 
        id="name" 
        #nameInput 
        [value]="orphan.name" 
        placeholder="Enter Name" 
        required>
    </div>
    <div class="form-group">
      <label for="age">Age:</label>
      <input 
        type="number" 
        id="age" 
        #ageInput 
        [value]="orphan.age" 
        placeholder="Enter Age" 
        required>
    </div>
    <div class="form-group">
      <label for="gender">Gender:</label>
      <select id="gender" #genderInput>
        <option value="Male" [selected]="orphan.gender === 'Male'">Male</option>
        <option value="Female" [selected]="orphan.gender === 'Female'">Female</option>
        <option value="Other" [selected]="orphan.gender === 'Other'">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label for="health">Health Condition:</label>
      <input 
        type="text" 
        id="health" 
        #healthInput 
        [value]="orphan.health || ''" 
        placeholder="Enter Health Condition">
    </div>
    <div class="form-group">
      <label for="adoptionStatus">Adoption Status:</label>
      <select id="adoptionStatus" #adoptionStatusInput>
        <option value="Available" [selected]="orphan.adoption_status === 'Available'">Available</option>
        <option value="Pending" [selected]="orphan.adoption_status === 'Pending'">Pending</option>
        <option value="Adopted" [selected]="orphan.adoption_status === 'Adopted'">Adopted</option>
      </select>
    </div>
    <div class="form-actions">
      <button (click)="saveOrphan(nameInput.value, ageInput.value, genderInput.value, healthInput.value, adoptionStatusInput.value)" [disabled]="loading">Save</button>
      <button (click)="deleteOrphan()" [disabled]="loading">Delete</button>
      <button (click)="cancelEdit()" [disabled]="loading" class="cancel-button">Cancel</button>
    </div>
  </div>

  
  <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
</div>

<style>
  .orphan-container {
    max-width: 600px;
    margin: 20px auto;
    padding: 20px 20px 60px; 
    background-color: white;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    border-radius: 5px;
    position: relative;
    z-index: 1; 
  }
  .loading {
    color: #333;
    font-style: italic;
    text-align: center;
  }
  .form-group {
    margin-bottom: 15px;
  }
  .form-group label {
    display: block;
    margin-bottom: 5px;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
  }
  .form-actions {
    margin-top: 15px;
    text-align: center;
    position: relative;
    padding-bottom: 20px; 
  }
  button {
    margin-right: 10px;
    padding: 5px 10px;
  }
  button[disabled] {
    cursor: not-allowed;
    opacity: 0.6;
  }
  .cancel-button {
    background-color: #f44336;
    color: white;
    border: none;
  }
  .cancel-button:hover:not([disabled]) {
    background-color: #d32f2f;
  }
  .error-message {
    color: red;
    text-align: center;
  }
  .success-message {
    color: green;
    text-align: center;
  }
</style>
