<div class="create-staff-container">
  <img src="staffdet.jpg" alt="Background Image" class="bg-image">
  <h2>Create Staff Records</h2>
  <div class="form-container">
    <form id="staffForm">
      <div class="form-group">
        <input type="text" id="id" name="id" placeholder="Enter Staff ID" required>
      </div>
      <div class="form-group">
        <input type="text" id="name" name="name" placeholder="Enter Staff Name" required>
      </div>
      <div class="form-group">
        <input type="number" id="age" name="age" placeholder="Enter Staff Age" required>
      </div>
      <div class="form-group">
        <label for="gender">Gender:</label>
        <select id="gender" required>
          <option value="" disabled selected>Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Others">Others</option>
        </select>
      </div>
      <div class="form-group">
        <input type="number" id="experience" name="experience" placeholder="Enter Years of Experience" required>
      </div>
      <div class="form-group">
        <input type="text" id="address" name="address" placeholder="Enter Address" required>
      </div>
      <div class="form-group">
        <label for="role">Role:</label>
        <select id="role" required>
          <option value="" disabled selected>Select Role</option>
          <option value="Caregiver">Caregiver - Looks after children's daily needs</option>
          <option value="Educator">Educator - Teaches and educates children</option>
          <option value="Administrator">Administrator - Manages records and operations</option>
          <option value="Maintenance Worker">Maintenance Worker - Handles facility upkeep</option>
        </select>
      </div>
      <div class="form-group">
        <input type="text" id="contact" name="contact" placeholder="Enter 10-digit Phone Number (e.g., 1234567890)" required>
      </div>
      <div class="form-group">
        <button type="button" (click)="createStaff($event)">Create Staff</button>
      </div>
    </form>
  </div>
  <p class="error-message">{{ errorMessage }}</p>
  <a href="/admin-dashboard"><button class="back-button">Back to Dashboard</button></a>
</div>
