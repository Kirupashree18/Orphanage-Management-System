<img src="donate_item.jpg" alt="Background Image" class="bg-image" width="25%">
<div class="container">
    <h2>Donate Items</h2>
    <form (ngSubmit)="onSubmit($event)" #donationForm="ngForm">
        <label for="donor-name">Donor Name:</label>
        <input 
            type="text" 
            id="donor-name" 
            [(ngModel)]="donorName" 
            name="donorName" 
            placeholder="Enter your name" 
            required>

        <label for="address">Address:</label>
        <input 
            type="text" 
            id="address" 
            [(ngModel)]="address" 
            name="address" 
            placeholder="Enter your address" 
            required>

        <label for="item-name">Item Name:</label>
        <input 
            type="text" 
            id="item-name" 
            [(ngModel)]="itemName" 
            name="itemName" 
            placeholder="Enter item name" 
            required>

        <label for="quantity">Quantity:</label>
        <input 
            type="number" 
            id="quantity" 
            [(ngModel)]="quantity" 
            name="quantity" 
            placeholder="Enter quantity" 
            required>

        <label for="category">Category:</label>
        <select 
            id="category" 
            [(ngModel)]="category" 
            name="category" 
            required>
            <option value="" disabled selected>Select a category</option>
            <option value="Clothes">Clothes</option>
            <option value="Books">Books</option>
            <option value="School Supplies">School Supplies</option>
            <option value="Other">Other</option>
        </select>

        <label for="donation-date">Donation Date:</label>
        <input 
            type="date" 
            id="donation-date" 
            [(ngModel)]="donationDate" 
            name="donationDate" 
            required>
            
        <button type="submit">Donate</button>
        <button class="back" > <a href="/donor-dashboard">Back</a></button>
    </form>

    <div class="success-message" [class.visible]="showSuccess">
        <span class="tick">✔️</span> Donation of <span>{{ donationDetails }}</span> completed successfully! Thank you for your contribution.
    </div>
</div>
