<div class="staff-container">
    <h2>Update Staff Details</h2>
    <img src="staffdet.jpg" alt="Background Image" class="bg-image">
   
    <div *ngIf="loading" class="loading">Loading...</div>
  
 
    <div class="form-group">
      <label for="staffId">Staff ID:</label>
      <input 
        type="text" 
        id="staffId" 
        #staffIdInput 
        placeholder="Enter Staff ID" 
        required>
      <button (click)="fetchStaffDetails(staffIdInput.value)" [disabled]="loading">Get Staff Details</button>
      <a href="/admin-dashboard"><button class="back-button">Back to Dashboard</button></a>
    </div>
  
    <div *ngIf="staff" class="update-staff-form">
      <h3>Edit Staff Details</h3>
      <div class="form-group">
        <label for="name">Name:</label>
        <input 
          type="text" 
          id="name" 
          #nameInput 
          [value]="staff.name" 
          placeholder="Enter Name" 
          required>
      </div>
      <div class="form-group">
        <label for="age">Age:</label>
        <input 
          type="number" 
          id="age" 
          #ageInput 
          [value]="staff.age" 
          placeholder="Enter Age" 
          required>
      </div>
      <div class="form-group">
        <label for="gender">Gender:</label>
        <select id="gender" #genderInput>
          <option value="Male" [selected]="staff.gender === 'Male'">Male</option>
          <option value="Female" [selected]="staff.gender === 'Female'">Female</option>
          <option value="Other" [selected]="staff.gender === 'Other'">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="experience">Experience (Years):</label>
        <input 
          type="number" 
          id="experience" 
          #experienceInput 
          [value]="staff.experience" 
          placeholder="Enter Experience" 
          required>
      </div>
      <div class="form-group">
        <label for="address">Address:</label>
        <input 
          type="text" 
          id="address" 
          #addressInput 
          [value]="staff.address" 
          placeholder="Enter Address" 
          required>
      </div>
      <div class="form-group">
        <label for="role">Role:</label>
        <input 
          type="text" 
          id="role" 
          #roleInput 
          [value]="staff.role" 
          placeholder="Enter Role" 
          required>
      </div>
      <div class="form-group">
        <label for="contact">Contact:</label>
        <input 
          type="text" 
          id="contact" 
          #contactInput 
          [value]="staff.contact" 
          placeholder="Enter Contact" 
          required>
      </div>
      <div class="form-actions">
        <button (click)="saveStaff(nameInput.value, ageInput.value, genderInput.value, experienceInput.value, addressInput.value, roleInput.value, contactInput.value)" [disabled]="loading">Save</button>
        <button (click)="deleteStaff()" [disabled]="loading">Delete</button>
        <button (click)="cancelEdit()" [disabled]="loading" class="cancel-button">Cancel</button>
      </div>
    </div>
  
 
    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
  </div>
