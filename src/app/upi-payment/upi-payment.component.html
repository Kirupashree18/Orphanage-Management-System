<img src="upi_payment.jpg" alt="Background Image" class="bg-image" width="25%">
<div class="container">
    <h2>UPI Payment</h2>
    <form id="upiForm">
        <label for="upi-id">UPI ID:</label>
        <input type="text" id="upi-id" placeholder="Enter your UPI ID" required>
        <br>
        <label for="amount">Amount:</label>
        <input type="number" id="amount" placeholder="Enter amount" required>
        <br>
        <button type="button" (click)="onSubmit()">Proceed with UPI</button>
    </form>

    <div class="success-message" *ngIf="showSuccessMessage">
        <span class="tick">✔️</span> Donation completed successfully! Thank you for your contribution.
    </div>
</div>
